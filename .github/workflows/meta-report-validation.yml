name: Validar coleta mensal Meta

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Mês encerrado (YYYY-MM); vazio usa o mês anterior'
        required: false
        type: string
      mode:
        description: 'Modo de execução'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - backfill_ids

# Ativar somente depois da reconciliação com o Gerenciador e teste da escrita:
#  schedule:
#    - cron: '0 0 2 * *'
#      timezone: America/Sao_Paulo
# O GitHub pode atrasar execuções. Repositórios públicos inativos por 60 dias
# podem ter o agendamento desativado automaticamente.

permissions:
  contents: read

concurrency:
  group: nextqs-meta-report
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar clientes Google
        run: python -m pip install --disable-pip-version-check gspread google-auth
      - name: Testar transformação e preservação de dados
        run: python -m unittest discover -s tests -p 'test_meta_report.py' -v
      - name: Consultar Meta e reconciliar com a planilha sem escrever
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          META_API_VERSION: v26.0
          REPORT_MONTH: ${{ inputs.month }}
          REPORT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          args=(--output "$RUNNER_TEMP/nextqs-meta")
          if [ -n "$REPORT_MONTH" ]; then args+=(--month "$REPORT_MONTH"); fi
          if [ "$REPORT_MODE" = "backfill_ids" ]; then
            args+=(--backfill-ids)
          else
            args+=(--check-sheet)
          fi
          python integrations/meta_report.py "${args[@]}"
      - name: Remover dados temporários do runner
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/nextqs-meta"
